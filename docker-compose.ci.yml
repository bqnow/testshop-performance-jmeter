services:
  # Der JMeter-Container
  jmeter:
    image: justb4/jmeter:latest
    volumes:
      - .:/tests
    # Wir übergeben die Parameter direkt hier
    # 'app' ist der Hostname im Docker-Netzwerk (da wir es später linken)
    command: >
      -n -t /tests/jmx/smoketestjmx.jmx -l /tests/results/result.jtl -e -o /tests/results/report -JHOST=app -JPORT=3000
    depends_on:
      app:
        condition: service_healthy

  # Wir definieren 'app' hier nur als Platzhalter (external), 
  # damit docker-compose nicht meckert. In der CI wird es durch die echte App ersetzt.
  app:
    image: ${SHOP_IMAGE:-ghcr.io/bqnow/testshop:latest}
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3000\", (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1)).on(\"error\", () => process.exit(1))'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
